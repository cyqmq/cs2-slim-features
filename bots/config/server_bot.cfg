// CS2 Slim 服务端人机玩法配置 (bots 功能包)
// 用法:
//   1) 在 server.cfg 末尾加: exec server_bot
//   2) 或启动参数加: +exec server_bot
//   3) 或在服务端控制台手动执行 exec server_bot

// 机器人数量与填充模式
bot_quota 5
bot_quota_mode fill        // fill=按人数补齐, normal=固定数量
bot_difficulty 2          // 0=简单 1=普通 2=困难 3=专家
bot_join_after_player 0   // 不等待真人玩家加入
bot_autodifficulty_threshold_low -2
bot_autodifficulty_threshold_high 3

// 队伍平衡
mp_limitteams 0
mp_autoteambalance 1

// 快速开局
mp_warmup_end
mp_freezetime 5

// 显示提示
echo "[cs2-slim] server_bot.cfg loaded - bots enabled"