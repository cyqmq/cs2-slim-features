// CS2 客户端离线练习配置 (bots 功能包)
// 用法:
//   1) 本地开图: 启动参数加 -insecure +map de_dust2 +exec offline_practice
//   2) 或连接精简服务端后, 在控制台 exec offline_practice (需服务端允许)
//   3) 或在游戏内控制台手动执行

sv_cheats 1
mp_warmup_end
mp_freezetime 5
mp_roundtime 60
mp_maxrounds 30

// 机器人
bot_quota 5
bot_quota_mode fill
bot_difficulty 2
bot_add_t
bot_add_ct

// 练习辅助
sv_infinite_ammo 1
ammo_grenade_limit_total 5
mp_buy_anywhere 1
mp_teammates_are_enemies 0

// 显示提示
echo "[cs2-slim] offline_practice.cfg loaded - bots practice enabled"